name: Release plugin
on:
  push:
    branches: [main]
    paths: [manifest.json, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    concurrency: release-homebound-webdav
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test and verify the committed build
        run: |
          node --test tests/sync.test.cjs
          node build.mjs
          git diff --exit-code -- main.js
      - name: Attest the three installation files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css
      - name: Verify the signed provenance against the release commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in main.js manifest.json styles.css; do
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA"
          done
      - name: Publish the version in the manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p 'require("./manifest.json").version')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh release view "$version" >/dev/null 2>&1; then
            draft=$(gh release view "$version" --json isDraft --jq '.isDraft')
            if [[ "$draft" == false ]]; then
              echo "This version is already public."
              exit 0
            fi
          else
            gh release create "$version" --draft --target "$GITHUB_SHA" \
              --title "Homebound WebDAV $version" --generate-notes
          fi
          gh release upload "$version" main.js manifest.json styles.css --clobber
          gh release edit "$version" --draft=false
